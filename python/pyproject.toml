[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "ohdsi-cyclops"
version = "3.7.1.dev0"
description = "Cyclic coordinate descent for large-scale regularized regression (OHDSI Cyclops)"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    { name = "Marc A. Suchard", email = "msuchard@ucla.edu" },
    { name = "Observational Health Data Sciences and Informatics" },
]
keywords = ["regression", "lasso", "cox", "ohdsi", "observational", "epidemiology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
]

[project.optional-dependencies]
test = ["pytest>=7"]
# The R package is the numerical ground truth for the parity test-suite.
parity = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/OHDSI/Cyclops"
Issues = "https://github.com/OHDSI/Cyclops/issues"

# ---------------------------------------------------------------------------
# scikit-build-core
# ---------------------------------------------------------------------------

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/cyclops"]
sdist.exclude = [".venv", "build", "**/__pycache__", "**/.pytest_cache"]

[tool.scikit-build.cmake]
version = ">=3.19"
build-type = "Release"

# CYCLOPS_ROOT defaults to the enclosing checkout (see CMakeLists.txt) and can
# be overridden with `-C cmake.define.CYCLOPS_ROOT=...` to build the extension
# against an out-of-tree core.

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "parity: compares results against the R Cyclops package (needs R + Cyclops installed)",
    "slow: takes more than a few seconds",
]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_i686 pp*"
test-extras = ["test"]
test-command = "pytest {project}/tests -m 'not parity'"
build-verbosity = 1

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
